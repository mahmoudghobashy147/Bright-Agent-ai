<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>إعداد Bright Ai</title><style>body{background:#091e1b;color:#eef8f4;font:18px system-ui;display:grid;place-items:center;min-height:95vh}main{max-width:600px;padding:40px;background:#12352d;border-radius:24px}input,button{box-sizing:border-box;width:100%;padding:16px;border:1px solid #609b86;border-radius:12px;font:inherit;margin:12px 0}button{background:#90edc5;cursor:pointer}input{direction:ltr}p{line-height:1.8}#status{color:#ffc7b9}</style></head><body><main><h1>Bright Ai</h1><h2>اربط برنامجك بلوحة شركتك</h2><p>أدخل رابط خادم Bright Ai الذي جهّزه مسؤول المنصة، ثم سجّل الدخول بحساب الشركة. بيانات الربط السرية تظل على الخادم.</p><form id="connect"><label for="server">عنوان لوحة الشركة</label><input id="server" type="url" required placeholder="https://your-server/console/" autocomplete="url"><button id="submit">اتصال وفتح البرنامج</button></form><p id="status" role="status"></p></main><script src="setup.js"></script></body></html>
