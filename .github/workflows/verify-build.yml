name: Verify and build Windows installer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - run: npm run scan
      - run: npm ci --prefix cloud --ignore-scripts
      - run: npm audit --prefix cloud --omit=dev --audit-level=moderate
      - run: npm run build --prefix cloud
      - run: python3 scripts/package-apphosting.py artifacts/Bright-Ai-AppHosting-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bright-Ai-AppHosting-Source
          path: artifacts/Bright-Ai-AppHosting-Source.zip
          retention-days: 14
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test real Auth, API startup and Firestore in isolated emulators
        run: npx --yes firebase-tools emulators:exec --config firebase/emulator.json --project demo-bright-ai --only firestore,auth "node --test tests/firestore.test.js tests/apphosting-startup.test.js"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bright-Ai-Server-Verification
          path: cloud/package-lock.json
          retention-days: 14
  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --prefix desktop
      - run: npm audit --prefix desktop --audit-level=high
      - run: npm run dist:win --prefix desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and launch actual packaged application
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bright-Ai-Windows-Candidate
          path: |
            desktop/dist/Bright-Ai-Setup.exe
            artifacts/windows-*
            desktop/package-lock.json
            cloud/package-lock.json
          if-no-files-found: error
          retention-days: 14
